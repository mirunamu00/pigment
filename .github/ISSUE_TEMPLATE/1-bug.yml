name: Bug report
description: Something on the site, the API, the MCP server or the harness doesn't work as it should.
labels: [bug, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Site (pigmentui.com)
        - HTTP API (/api/v1)
        - MCP server — remote (pigmentui.com/mcp)
        - MCP server — npm (pigment-mcp)
        - Harness (pnpm harness)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact error message, the page URL or the tool call, and a screenshot if it's visual.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. claude mcp add --transport http pigment https://pigmentui.com/mcp
        2. Ask: "List the Pigment design systems."
        3. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Agent and version (Claude Code, Codex, Cursor…), browser or OS, pigment-mcp version if you use npm.
      placeholder: Claude Code 2.x on macOS, pigment-mcp 0.4.1
