name: Feature request
description: An idea for the site, the MCP server, the API or the harness.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The behavior you'd like. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
