name: Suggest a design system
description: A website whose design language you'd like as a Pigment system.
labels: [system-request, triage]
body:
  - type: markdown
    attributes:
      value: |
        Systems are **derived design languages, never clones**: the pipeline measures a reference and
        writes an original system from it — no logos, names, copy, imagery or proprietary fonts carry
        over. Every system is then applied to four reference apps and published only after review.
  - type: textarea
    id: references
    attributes:
      label: Reference pages
      description: 2–4 public URLs of different page types from the same site (home, a product or feature page, docs or pricing). One page isn't enough to see a system.
      placeholder: |
        https://example.com
        https://example.com/pricing
    validations:
      required: true
  - type: textarea
    id: liked
    attributes:
      label: What you like about it
      description: The qualities to keep — typography, density, color restraint, motion, details.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you'd build with it
      description: Dashboards, a store, docs, a marketing site… It helps decide the rules the reference never shows.
  - type: checkboxes
    id: terms
    attributes:
      label: Before you submit
      options:
        - label: The reference pages are publicly accessible without logging in.
          required: true
        - label: I understand the result is an original system inspired by the reference, not a copy of it.
          required: true
