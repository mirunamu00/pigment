name: Design system feedback
description: An agent applied a Pigment system and the result is off — a missing rule, a wrong value, a component that isn't covered.
labels: [design-system, triage]
body:
  - type: markdown
    attributes:
      value: |
        Feedback like this becomes an update of the system: it is re-applied to the four reference apps,
        evaluated and published with a dated changelog entry. Projects that already use the system keep
        their copy until they ask their agent to update.
  - type: input
    id: system
    attributes:
      label: Design system
      placeholder: margin-notes
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - The agent ignored or misread a rule
        - The spec has no rule for this situation
        - A token value looks wrong (contrast, spacing, color…)
        - A component isn't specified
        - Dark mode
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the agent built
      description: Screenshots help most. Mention the screen and what looks wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: How it should look or behave according to the system — or what the system should say.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Agent and setup
      description: Which agent, and how it got the spec (MCP, spec URL, agent.md file). The date in your project's design-system/VERSION, if there is one.
      placeholder: Claude Code via remote MCP — design-system/VERSION says "margin-notes, updated 2026-10-12"
