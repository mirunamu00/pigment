name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Content (systems valid, published versions untouched)
        run: pnpm check:content
      - name: Playwright browser
        run: pnpm --filter @pigment/web exec playwright install --with-deps chromium
      - name: Tests (harness, content, MCP server, site e2e)
        run: pnpm test
      - name: MCP package builds and packs
        run: |
          pnpm --filter @pigment/mcp release:build
          npm pack ./packages/mcp/release --dry-run
