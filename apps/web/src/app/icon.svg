<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One irregular bloom: a single shape pushed around by low-frequency noise. -->
    <filter id="edge" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="21" />
      <feDisplacementMap in="SourceGraphic" scale="11" />
    </filter>
    <!-- Wet pigment: blur the color field, then swirl it so no boundary stays straight. -->
    <filter id="wet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" result="flow" />
      <feDisplacementMap in="soft" in2="flow" scale="14" />
    </filter>
    <mask id="shape">
      <ellipse cx="32" cy="32.5" rx="24" ry="22.5" fill="#fff" filter="url(#edge)" />
    </mask>
  </defs>
  <g mask="url(#shape)">
    <g filter="url(#wet)" opacity="0.86">
      <rect x="0" y="0" width="64" height="64" fill="#6f63e3" />
      <ellipse cx="22" cy="26" rx="15" ry="10" transform="rotate(-28 22 26)" fill="#2c4be0" />
      <ellipse cx="44" cy="17" rx="9" ry="6" transform="rotate(20 44 17)" fill="#ee4f8a" />
      <ellipse cx="31" cy="40" rx="7" ry="5" fill="#ee4f8a" opacity="0.8" />
      <ellipse cx="47" cy="39" rx="11" ry="8" transform="rotate(-40 47 39)" fill="#ffb21f" />
      <ellipse cx="16" cy="45" rx="9" ry="7" transform="rotate(15 16 45)" fill="#10a596" />
      <ellipse cx="38" cy="29" rx="5" ry="4" fill="#ffd166" opacity="0.85" />
      <ellipse cx="28" cy="54" rx="7" ry="4" fill="#ffb21f" opacity="0.7" />
      <ellipse cx="53" cy="27" rx="4" ry="6" fill="#10a596" opacity="0.6" />
    </g>
  </g>
  <g filter="url(#edge)">
    <circle cx="56.5" cy="51" r="2.2" fill="#ffb21f" opacity="0.8" />
    <circle cx="8" cy="17" r="1.6" fill="#2c4be0" opacity="0.75" />
  </g>
</svg>
