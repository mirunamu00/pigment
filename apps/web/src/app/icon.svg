<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="4" />
      <feDisplacementMap in="SourceGraphic" scale="6" />
    </filter>
    <filter id="wet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="rim">
      <feMorphology in="SourceGraphic" operator="erode" radius="1.6" result="inner" />
      <feComposite in="SourceGraphic" in2="inner" operator="out" />
    </filter>
    <mask id="shape">
      <g fill="#fff" filter="url(#edge)">
        <circle cx="26" cy="27" r="17" />
        <circle cx="41" cy="24" r="13" />
        <circle cx="41" cy="41" r="14" />
        <circle cx="24" cy="42" r="12.5" />
      </g>
    </mask>
    <g id="pigments" filter="url(#wet)">
      <circle cx="21" cy="23" r="14" fill="#2f4ce0" />
      <circle cx="44" cy="19" r="12" fill="#ef4f86" />
      <circle cx="46" cy="44" r="13" fill="#ffb21f" />
      <circle cx="19" cy="46" r="12" fill="#0fa596" />
      <circle cx="33" cy="32" r="8" fill="#7d55dd" />
    </g>
  </defs>
  <g mask="url(#shape)">
    <g opacity="0.78"><use href="#pigments" /></g>
    <g filter="url(#rim)"><use href="#pigments" /></g>
  </g>
  <g filter="url(#edge)">
    <circle cx="54.5" cy="54" r="2.6" fill="#ffb21f" opacity="0.85" />
    <circle cx="9.5" cy="13" r="2" fill="#2f4ce0" opacity="0.8" />
    <circle cx="56" cy="11.5" r="1.4" fill="#ef4f86" opacity="0.8" />
  </g>
</svg>
